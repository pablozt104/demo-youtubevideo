  <script>
    // GTM Tracking for YouTube Video using the YouTube IFrame API
    var player;

    // When the API is ready
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Event listener for video state changes
    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: 'youtube_video_play',
          videoTitle: 'Zoom desde Madrid 10 de Octubre del 2024'
        });
      } else if (event.data == YT.PlayerState.PAUSED) {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: 'youtube_video_pause',
          videoTitle: 'Zoom desde Madrid 10 de Octubre del 2024'
        });
      } else if (event.data == YT.PlayerState.ENDED) {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: 'youtube_video_end',
          videoTitle: 'Zoom desde Madrid 10 de Octubre del 2024'
        });
      }
    }

    // Form submission event for GTM tracking
    document.getElementById('contact-form').addEventListener('submit', function(event) {

        formName: 'Contact Form'
